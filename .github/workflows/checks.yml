name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Offline tests and publication checks
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TRADING_ENABLED: "false"
      HL_TESTNET: "true"
      INCLUDE_ACCOUNT_IN_LLM: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Check publication boundary
        run: python scripts/check_publication.py
      - name: Scan source and history for secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $scanTool = Join-Path $env:RUNNER_TEMP 'gitleaks-tool'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks checksum mismatch' }
          Expand-Archive $archive -DestinationPath $scanTool
          & (Join-Path $scanTool 'gitleaks.exe') git . --redact=100 --no-banner --log-opts=--all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $scanTool 'gitleaks.exe') dir . --redact=100 --no-banner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install isolated dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --require-virtualenv -r requirements.lock -r requirements-dev.txt
      - name: Lint Python
        run: .\.venv\Scripts\ruff.exe check .
      - name: Check JavaScript
        run: |
          node --check app/static/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/static/utils.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
      - name: Offline regression suite
        run: .\.venv\Scripts\python.exe -m pytest tests/ -q
      - name: Install browser
        run: .\.venv\Scripts\python.exe -m playwright install chromium
      - name: Offline responsive UI smoke
        run: .\.venv\Scripts\python.exe scripts/ui_smoke.py
