name: Feature suggestion
description: Describe a user need and the expected benefit.
title: "[Suggestion]: "
body:
  - type: markdown
    attributes:
      value: "Suggestions are welcome; official code is maintained by the owner. Describe the workflow with synthetic examples, without keys, account data or return guarantees."
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior and alternatives
      description: Explain the user benefit and any effect on Preview/Confirm, protection, privacy or Testnet/Mainnet clarity.
    validations:
      required: true
