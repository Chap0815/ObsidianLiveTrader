name: Bug report
description: Report a reproducible defect with sanitized evidence.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private Security reporting channel. Never attach secrets, raw logs or real account data."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python version, browser, exchange and Testnet/Mainnet mode
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic examples; do not reproduce against live funds.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error excerpt
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets and private account information from this report.
          required: true
