<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Obsidian Live Trader{% endblock %}</title>
  <link rel="icon" href="/static/obsidian.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version|default('r6') }}" />
  <!-- Vendored locally (v4.2.0, Apache-2.0) — no CDN dependency for the chart -->
  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  {# Localhost-only page: inject token so private API calls work without localStorage #}
  <script>
    window.LOCAL_API_TOKEN = {{ (local_api_token or "")|tojson }};
  </script>
  <script src="/static/app.js?v={{ asset_version|default('r6') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
